name: Scout footage
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Requêtes séparées par | (préfixe facultatif commons:, nasa:, archive:, pixabay:)"
        required: true
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          Q: ${{ github.event.inputs.queries }}
        run: |
          IFS='|' read -ra A <<< "$Q"
          python3 engine/scout.py "${A[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: scout
          path: scout/
      - name: Résultats aussi sur une branche (lisibles sans accès aux artefacts)
        run: |
          git config user.name scout-bot; git config user.email scout-bot@users.noreply.github.com
          git checkout -q --orphan "scout/${{ github.run_id }}"; git rm -rq --cached . ; git add -f scout; git commit -qm "scout ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/scout/${{ github.run_id }}"
