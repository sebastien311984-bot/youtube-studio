name: Scout footage
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Requêtes séparées par | (préfixe facultatif commons:, nasa:, archive:, pixabay:)"
        required: true
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          Q: ${{ github.event.inputs.queries }}
        run: |
          IFS='|' read -ra A <<< "$Q"
          python3 engine/scout.py "${A[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: scout
          path: scout/
