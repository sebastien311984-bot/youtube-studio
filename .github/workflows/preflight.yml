name: Preflight
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Chemin du JSON d'épisode"
        required: true
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow imagehash
      - run: python3 engine/preflight.py "${{ github.event.inputs.episode }}" preflight
      - name: Résultats sur une branche
        run: |
          rm -f preflight/[0-9]*
          git config user.name preflight-bot; git config user.email preflight-bot@users.noreply.github.com
          git checkout -q --orphan "preflight/${{ github.run_id }}"; git rm -rq --cached . ; git add -f preflight; git commit -qm "preflight ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/preflight/${{ github.run_id }}"
