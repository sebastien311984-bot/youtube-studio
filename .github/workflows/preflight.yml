name: Preflight
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Chemin du JSON d'épisode"
        required: true
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow imagehash
      - run: python3 engine/preflight.py "${{ github.event.inputs.episode }}" preflight
      - name: Résultats sur une branche
        run: |
          find preflight -type f ! -name 'preflight*' -delete
          echo "::notice::$(head -c 900 preflight/preflight.txt | tr '\n' ' ')"
          git config user.name preflight-bot; git config user.email preflight-bot@users.noreply.github.com
          git checkout -q --orphan "preflight/${{ github.run_id }}" 2>err.txt || echo "::error::checkout $(cat err.txt)"
          git rm -rq --cached . ; git add -f preflight; git commit -qm "preflight ${{ github.run_id }}" 2>err.txt || echo "::error::commit $(cat err.txt)"
          git push -q origin "HEAD:refs/heads/preflight/${{ github.run_id }}" 2>err.txt || { echo "::error::push $(tr "\n" " " < err.txt)"; exit 1; }
