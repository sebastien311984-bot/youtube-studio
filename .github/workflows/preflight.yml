name: Preflight
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Chemin du JSON d'épisode"
        required: true
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          curl -sSL -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          sudo mkdir -p /usr/share/fonts/opentype/inter && sudo unzip -q -j -o inter.zip 'extras/otf/*' -d /usr/share/fonts/opentype/inter && fc-cache -f
          pip install -q manim==0.19.2 edge-tts numpy pillow imagehash
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 engine/check_episode.py "${{ github.event.inputs.episode }}" > preflight_check.txt 2>&1 || true; python3 engine/preflight.py "${{ github.event.inputs.episode }}" preflight; mv preflight_check.txt preflight/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight
          path: |
            preflight/*.jpg
            preflight/*.txt
      - name: Résultats sur une branche
        continue-on-error: true
        run: |
          rm -rf preflight/clips preflight/*.mp4 preflight/*.png
          git config user.name preflight-bot; git config user.email preflight-bot@users.noreply.github.com
          git checkout -q --orphan "pf/${{ github.run_id }}"; git rm -rq --cached . ; git add -f preflight; git commit -qm "preflight ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/pf/${{ github.run_id }}"
