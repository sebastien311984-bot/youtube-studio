name: Render videos
# Monte automatiquement chaque épisode ajouté ou modifié dans channels/oddly-logical/episodes/
# Les MP4 sont téléchargeables dans l'onglet Actions > run > Artifacts.
on:
  push:
    paths: ["channels/*/episodes/**.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Chemin d'un épisode (vide = tous)"
        required: false
      from_run:
        description: "Sans rendu : reprendre l'artefact d'une exécution (ID) pour refaire planches + livrables"
        required: false
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Reprendre un rendu existant
        if: github.event.inputs.from_run != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "${{ github.event.inputs.from_run }}" -n videos -D out
      - name: Dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          sudo mkdir -p /usr/share/fonts/opentype/inter && sudo unzip -q -j -o inter.zip 'extras/otf/*' -d /usr/share/fonts/opentype/inter && fc-cache -f
          sudo apt-get install -y -qq espeak-ng librsvg2-bin imagemagick && pip install -q -U edge-tts piper-tts "kokoro>=0.9.4" soundfile numpy pillow
      - name: Épisodes à monter
        id: list
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then echo "files=${{ github.event.inputs.episode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then echo "files=$((git diff --name-only HEAD~1 HEAD -- 'channels/*/episodes/*.json' 2>/dev/null || true) | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else echo "files=$(ls channels/*/episodes/*.json | tr '\n' ' ')" >> $GITHUB_OUTPUT; fi
      - name: Cache des plans téléchargés (archives lourdes, pas retéléchargées à chaque rendu)
        uses: actions/cache@v4
        with:
          path: clips
          key: clips-${{ hashFiles('channels/*/episodes/*.json') }}
          restore-keys: clips-
      - name: Rendu
        if: github.event.inputs.from_run == ''
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p out
          # suivi en direct : toutes les 2 min, la fin du journal est poussée sur la branche progress/<run>
          ( while sleep 120; do d=$(mktemp -d); cp out/*_render.log "$d/" 2>/dev/null; (date -u; df -h . | tail -1; du -sh clips 2>/dev/null) > "$d/status.txt"
              (cd "$d" && git init -q && git add -A && git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -qm p && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/progress/${{ github.run_id }}) >/dev/null 2>&1; rm -rf "$d"; done ) &
          for f in ${{ steps.list.outputs.files }}; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .json)
            set -o pipefail
            if ! python3 -u engine/render.py "$f" clips "out/$n.mp4" 2>&1 | tee "out/${n}_render.log"; then
              echo "::error::$(grep -v "curl: (22)" "out/${n}_render.log" | tail -6 | tr "\n" " ")"
              exit 1
            fi
          done
      - name: Planche de contrôle (poussée sur la branche review/)
        if: always()
        run: |
          mkdir -p review
          cp out/*_render.log review/ 2>/dev/null || true
          for v in out/*.mp4; do [ -f "$v" ] || continue; n=$(basename "$v" .mp4)
            ffmpeg -loglevel error -y -i "$v" -vf "fps=1/4,scale=320:-1,tile=8x10" -q:v 4 "review/${n}_sheet_%02d.jpg" || true
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$v" > "review/${n}_duration.txt" || true
            # Livrables légers lisibles sur téléphone (la version HD reste dans l'artefact « videos »)
            case "$n" in
              *short*) ffmpeg -v error -y -i "$v" -vf "scale=-2:854" -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k -movflags +faststart "review/${n}_preview.mp4" || true ;;
              *) ffmpeg -v error -y -i "$v" -vf "scale=-2:480" -c:v libx264 -crf 31 -preset veryfast -c:a aac -b:a 96k -movflags +faststart "review/${n}_preview.mp4" || true ;;
            esac
          done
          for x in jpg srt md json m4a; do cp out/*.$x review/ 2>/dev/null || true; done
          ls review | grep -q . || exit 0
          git config user.name render-bot; git config user.email render-bot@users.noreply.github.com
          git checkout -q --orphan "review/${{ github.run_id }}"; git rm -rq --cached . ; git add -f review; git commit -qm "review ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/review/${{ github.run_id }}"
      - name: Vidéos HD en Release (hors quota des artefacts)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.mp4 >/dev/null 2>&1 || exit 0
          gh release create "render-${{ github.run_id }}" out/*.mp4 out/*.jpg out/*.srt out/*.md -R "${{ github.repository }}" --target "${{ github.sha }}" -t "Rendu ${{ github.run_id }}" -n "Rendu automatique" --prerelease || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: videos
          path: out/*
          retention-days: 30
